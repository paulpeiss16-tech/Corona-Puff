<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corona-Puff</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Corona-Puff">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0f2a17">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: #0f2a17; overflow: hidden; }
  body { padding: env(safe-area-inset-top) 0 0; box-sizing: border-box; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: #0f2a17; }
  /* Ladebild mit Logo, bis die Seite da ist */
  #splash { position: fixed; inset: 0; display: grid; place-items: center; background: #0f2a17; transition: opacity .4s; }
  #splash img { width: 42vmin; max-width: 220px; border-radius: 22%; }
  #splash.weg { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<iframe id="puff" title="Corona-Puff" allow="clipboard-write"
  src="https://script.google.com/macros/s/AKfycbwj3sqvg0YvZ78qkyKM9_aeH4zywStee1AOePJsA8ji8Xgmt4NWsoIUPsArhccH0dgl/exec"></iframe>
<div id="splash"><img src="icon-512.png" alt="Corona-Puff"></div>
<script>
  // Ladebild ausblenden, sobald die Seite geladen ist (spätestens nach 8 Sekunden)
  const splash = document.getElementById('splash');
  const weg = () => splash.classList.add('weg');
  document.getElementById('puff').addEventListener('load', () => setTimeout(weg, 600));
  setTimeout(weg, 8000);
</script>
</body>
</html>
